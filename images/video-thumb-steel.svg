<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142C4E"/>
      <stop offset="50%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#05101F"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFC15D"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#9F7E18"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad2)"/>

  <!-- Steel Rebar Grid Pattern -->
  <g stroke="rgba(201, 162, 39, 0.22)" stroke-width="2">
    <line x1="50" y1="40" x2="550" y2="40"/>
    <line x1="50" y1="90" x2="550" y2="90"/>
    <line x1="50" y1="140" x2="550" y2="140"/>
    <line x1="50" y1="190" x2="550" y2="190"/>
    <line x1="50" y1="240" x2="550" y2="240"/>
    <line x1="50" y1="290" x2="550" y2="290"/>

    <line x1="100" y1="30" x2="100" y2="310"/>
    <line x1="180" y1="30" x2="180" y2="310"/>
    <line x1="260" y1="30" x2="260" y2="310"/>
    <line x1="340" y1="30" x2="340" y2="310"/>
    <line x1="420" y1="30" x2="420" y2="310"/>
    <line x1="500" y1="30" x2="500" y2="310"/>
  </g>

  <rect width="600" height="380" fill="black" opacity="0.4"/>

  <!-- Center Badge -->
  <rect x="40" y="40" width="165" height="32" rx="16" fill="rgba(11, 31, 58, 0.85)" stroke="#C9A227" stroke-width="1.5"/>
  <circle cx="56" cy="56" r="5" fill="#DFC15D"/>
  <text x="68" y="61" fill="#DFC15D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">RCC STRUCTURE</text>

  <text x="50" y="245" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">STEEL &amp; SLAB CASTING</text>
  <text x="50" y="272" fill="#DFC15D" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">GRADE-60 QUALITY TESTING</text>

  <!-- Play Watermark -->
  <circle cx="300" cy="170" r="44" fill="rgba(201, 162, 39, 0.2)" stroke="#C9A227" stroke-width="2"/>
  <polygon points="292,150 318,170 292,190" fill="#DFC15D"/>

  <rect x="4" y="4" width="592" height="372" fill="none" stroke="rgba(201, 162, 39, 0.3)" stroke-width="1.5" rx="8"/>
</svg>