<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 600" width="100%" height="100%">
  <defs>
    <!-- Royal Blue Gradient for Left Card Panel -->
    <linearGradient id="cardBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081B33"/>
      <stop offset="50%" stop-color="#0E2E5C"/>
      <stop offset="100%" stop-color="#0A2244"/>
    </linearGradient>

    <!-- Dot Pattern for Card Texture -->
    <pattern id="dotPattern" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="8" r="1.5" fill="#CBD5E1" opacity="0.65"/>
    </pattern>

    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card Background Container -->
  <rect width="1050" height="600" rx="18" fill="#FFFFFF"/>

  <!-- Right Half Dotted Pattern Texture -->
  <rect x="460" y="0" width="590" height="600" fill="url(#dotPattern)"/>

  <!-- Left Slanted Panel (Royal Blue as requested by user) -->
  <path d="M 0 0 L 640 0 L 480 600 L 0 600 Z" fill="url(#cardBlueGrad)"/>

  <!-- ==================== LEFT SIDE CONTENT (ROYAL BLUE) ==================== -->
  <g transform="translate(45, 60)">
    <!-- House & Key Logo -->
    <g transform="translate(10, 0)">
      <!-- Outer Circle for House -->
      <circle cx="65" cy="65" r="50" fill="none" stroke="#FFFFFF" stroke-width="7"/>
      <!-- House Roof & Base -->
      <path d="M 45 75 L 45 60 L 65 42 L 85 60 L 85 75 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
      <!-- Inner Door/Window -->
      <path d="M 58 75 L 58 64 A 7 7 0 0 1 72 64 L 72 75 Z" fill="#FFFFFF"/>
      <!-- Key Stem extending to the right -->
      <path d="M 115 65 L 240 65" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <!-- Key Teeth -->
      <path d="M 195 65 L 195 85 M 220 65 L 220 88 M 235 65 L 235 80" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
      <!-- Key decorative notch -->
      <circle cx="160" cy="65" r="5" fill="#0E2E5C"/>
    </g>

    <!-- Company Name: AL-RAHEEM ASSOCIATES -->
    <text x="18" y="180" font-family="'Poppins', 'Arial Black', sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="3">AL-RAHEEM</text>
    <text x="18" y="235" font-family="'Poppins', 'Arial Black', sans-serif" font-size="42" font-weight="900" fill="#FFFFFF" letter-spacing="8">ESTATE</text>

    <!-- Services Bullet Items -->
    <g font-family="'Poppins', 'Arial', sans-serif" font-weight="700" fill="#FFFFFF">
      <text x="18" y="295" font-size="23" letter-spacing="0.5">Booking Apartments &amp; Shops</text>
      <text x="18" y="338" font-size="22" letter-spacing="0.5">Resale-Flat  |  Shop  |  Office</text>

      <!-- Divider Line -->
      <line x1="18" y1="365" x2="440" y2="365" stroke="#FFFFFF" stroke-width="2.5" opacity="0.85"/>

      <text x="18" y="410" font-size="23" letter-spacing="0.5">Rent-Flat  |  Shop  |  Godown</text>
      <text x="215" y="452" font-size="26" font-weight="900" text-anchor="middle" fill="#C9A227">&amp;</text>
      <text x="18" y="495" font-size="24" letter-spacing="1">Property Assessment</text>
    </g>
  </g>

  <!-- ==================== RIGHT SIDE CONTENT (WHITE / SLANTED) ==================== -->
  <g transform="translate(560, 55)">
    <!-- Owner Name with Avatar Icon -->
    <g transform="translate(30, 40)">
      <!-- Person Icon (Royal Blue) -->
      <g transform="translate(0, 0)">
        <circle cx="20" cy="14" r="14" fill="#0E2E5C"/>
        <path d="M 0 46 C 0 34 8 28 20 28 C 32 28 40 34 40 46 Z" fill="#0E2E5C"/>
      </g>
      <!-- Owner Name in Royal Blue Bold -->
      <text x="55" y="38" font-family="'Poppins', 'Arial Black', sans-serif" font-size="42" font-weight="800" fill="#0E2E5C" letter-spacing="1">Zohaib Khan</text>
      <text x="55" y="66" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#C9A227" letter-spacing="2">FOUNDER &amp; PROPRIETOR</text>
    </g>

    <!-- WhatsApp Contact Info -->
    <g transform="translate(30, 210)">
      <!-- WhatsApp Icon (Official Green Badge) -->
      <circle cx="20" cy="20" r="22" fill="#25D366"/>
      <path d="M 12 25 L 14 19 C 13 17 13 15 14 13 C 16 10 19 9 22 10 C 25 11 27 13 28 16 C 29 19 28 22 25 24 C 23 25 21 25 19 25 Z" fill="#FFFFFF"/>
      <path d="M 16 16 C 16 17 17 19 18 20 C 19 21 21 22 22 22 L 23 21 C 23.5 20.5 24 20.5 24.5 21 L 26 22.5 C 26.5 23 26.5 23.5 26 24 C 25 25 24 25.5 23 25 C 20.5 24.5 18 22.5 16.5 20 C 15.5 18.5 15.5 17 16 16 Z" fill="#25D366"/>
      <!-- Phone Number -->
      <text x="60" y="28" font-family="'Poppins', 'Arial', sans-serif" font-size="34" font-weight="800" fill="#111827" letter-spacing="1">+92 341 8186681</text>
    </g>

    <!-- Location / Address -->
    <g transform="translate(30, 330)">
      <!-- Location Pin Icon -->
      <path d="M 20 6 C 11.2 6 4 13.2 4 22 C 4 33.5 20 48 20 48 C 20 48 36 33.5 36 22 C 36 13.2 28.8 6 20 6 Z M 20 28 C 16.7 28 14 25.3 14 22 C 14 18.7 16.7 16 20 16 C 23.3 16 26 18.7 26 22 C 26 25.3 23.3 28 20 28 Z" fill="#0E2E5C"/>
      
      <!-- Address Text Lines -->
      <g font-family="'Poppins', 'Arial', sans-serif" font-size="22" font-weight="700" fill="#1F2937" letter-spacing="0.3">
        <text x="50" y="20">Plot # 128, Shop # 4, Azan Centre,</text>
        <text x="50" y="55">Near NBP Bank,</text>
        <text x="50" y="90">Keamari, Karachi.</text>
      </g>
    </g>

    <!-- Registered Notice Bottom Right -->
    <g transform="translate(30, 480)">
      <line x1="50" y1="0" x2="380" y2="0" stroke="#E2E8F0" stroke-width="2"/>
      <text x="50" y="24" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#64748B" letter-spacing="1">ESTABLISHED 2016 &#8226; SINDH, PAKISTAN</text>
    </g>
  </g>
</svg>
