<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B3860"/>
      <stop offset="50%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#071322"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" fill="url(#bgGrad3)"/>

  <!-- High-Rise Commercial Tower Outline -->
  <g fill="none" stroke="rgba(201, 162, 39, 0.3)" stroke-width="2">
    <!-- Center Tower -->
    <polygon points="220,50 380,50 395,310 205,310"/>
    <line x1="220" y1="90" x2="380" y2="90"/>
    <line x1="216" y1="130" x2="384" y2="130"/>
    <line x1="213" y1="170" x2="387" y2="170"/>
    <line x1="210" y1="210" x2="390" y2="210"/>
    <line x1="207" y1="250" x2="393" y2="250"/>
    <line x1="300" y1="50" x2="300" y2="310"/>

    <!-- Left Building -->
    <rect x="70" y="160" width="110" height="150"/>
    <!-- Right Building -->
    <rect x="420" y="140" width="110" height="170"/>
  </g>

  <rect width="600" height="380" fill="black" opacity="0.38"/>

  <!-- Center Badge -->
  <rect x="40" y="40" width="165" height="32" rx="16" fill="rgba(11, 31, 58, 0.85)" stroke="#C9A227" stroke-width="1.5"/>
  <circle cx="56" cy="56" r="5" fill="#DFC15D"/>
  <text x="68" y="61" fill="#DFC15D" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">COMMERCIAL TOWER</text>

  <text x="50" y="245" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">CORPORATE ARCHITECTURE</text>
  <text x="50" y="272" fill="#DFC15D" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" letter-spacing="1">FACADE &amp; TURNKEY FINISHES</text>

  <!-- Play Watermark -->
  <circle cx="300" cy="170" r="44" fill="rgba(201, 162, 39, 0.2)" stroke="#C9A227" stroke-width="2"/>
  <polygon points="292,150 318,170 292,190" fill="#DFC15D"/>

  <rect x="4" y="4" width="592" height="372" fill="none" stroke="rgba(201, 162, 39, 0.3)" stroke-width="1.5" rx="8"/>
</svg>