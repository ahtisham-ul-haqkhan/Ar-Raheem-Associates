<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#E5C768"/>
      <stop offset="100%" stop-color="#9A7B1C"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="50%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#0B1F3A"/>
    </linearGradient>
    <pattern id="secpWatermark" width="200" height="200" patternUnits="userSpaceOnUse">
      <text x="30" y="100" fill="#0B1F3A" fill-opacity="0.03" font-size="28" font-family="Arial, sans-serif" font-weight="bold" transform="rotate(-30 100 100)">SECP CERTIFIED</text>
    </pattern>
  </defs>

  <!-- Paper background -->
  <rect width="800" height="1130" fill="#FFFFFF"/>
  <rect width="800" height="1130" fill="url(#secpWatermark)"/>

  <!-- Ornate Borders -->
  <rect x="25" y="25" width="750" height="1080" fill="none" stroke="#0B1F3A" stroke-width="4"/>
  <rect x="35" y="35" width="730" height="1060" fill="none" stroke="#C9A227" stroke-width="1.5"/>
  <rect x="42" y="42" width="716" height="1046" fill="none" stroke="#0B1F3A" stroke-width="0.75" stroke-dasharray="4,2"/>

  <!-- Corner Ornaments -->
  <g fill="#C9A227">
    <polygon points="42,42 75,42 75,47 47,47 47,75 42,75"/>
    <polygon points="758,42 725,42 725,47 753,47 753,75 758,75"/>
    <polygon points="42,1088 75,1088 75,1083 47,1083 47,1055 42,1055"/>
    <polygon points="758,1088 725,1088 725,1083 753,1083 753,1055 758,1055"/>
  </g>

  <!-- Header Section -->
  <g text-anchor="middle" font-family="'Times New Roman', serif">
    <circle cx="400" cy="115" r="45" fill="#0B1F3A"/>
    <circle cx="400" cy="115" r="40" fill="none" stroke="#C9A227" stroke-width="2"/>
    <!-- Emblem icon -->
    <path d="M400 85 L415 110 L385 110 Z" fill="#C9A227"/>
    <rect x="390" y="112" width="20" height="25" fill="#C9A227"/>
    <circle cx="400" cy="130" r="5" fill="#0B1F3A"/>

    <text x="400" y="195" font-size="16" letter-spacing="3" fill="#666666" font-weight="bold">SECURITIES AND EXCHANGE COMMISSION OF PAKISTAN</text>
    <text x="400" y="215" font-size="12" letter-spacing="1" fill="#888888">GOVERNMENT OF PAKISTAN - COMPANY REGISTRATION OFFICE</text>
    
    <line x1="200" y1="230" x2="600" y2="230" stroke="url(#borderGrad)" stroke-width="2"/>

    <text x="400" y="275" font-size="28" fill="#0B1F3A" font-weight="bold" letter-spacing="1">CERTIFICATE OF INCORPORATION</text>
    <text x="400" y="300" font-size="14" font-style="italic" fill="#555555">[Under Section 16 of the Companies Act, 2017 (XIX of 2017)]</text>
  </g>

  <!-- Document Meta and Registration Details -->
  <g font-family="Arial, sans-serif" font-size="13" fill="#333333">
    <rect x="80" y="335" width="640" height="50" fill="#F5F7FA" rx="6" stroke="#E2E8F0"/>
    <text x="100" y="365" font-weight="bold" fill="#0B1F3A">Corporate Universal Identification No (CUIN):</text>
    <text x="420" y="365" font-weight="bold" fill="#C9A227" font-size="16">0192847-KHI</text>
  </g>

  <!-- Main Body Text -->
  <g font-family="'Times New Roman', serif" font-size="16" fill="#1F2937">
    <text x="80" y="430">I hereby certify that</text>
    
    <rect x="80" y="450" width="640" height="60" fill="#FFFFFF" stroke="#0B1F3A" stroke-width="1.5" rx="4"/>
    <text x="400" y="488" text-anchor="middle" font-size="22" font-weight="bold" fill="#0B1F3A" letter-spacing="1">AR BUILDER &amp; DEVELOPER (PVT.) LIMITED</text>

    <text x="80" y="550" line-height="1.6">
      <tspan x="80" dy="0">is this day incorporated under the Companies Act, 2017 (XIX of 2017) and that the</tspan>
      <tspan x="80" dy="28">company is a Private Company Limited by Shares, having met all statutory</tspan>
      <tspan x="80" dy="28">requirements of capital, engineering management, and corporate compliance.</tspan>
    </text>

    <!-- Additional Formal Details Table -->
    <g transform="translate(80, 650)">
      <rect width="640" height="150" fill="#F8FAFC" stroke="#CBD5E1" rx="4"/>
      <line x1="20" y1="50" x2="620" y2="50" stroke="#E2E8F0"/>
      <line x1="20" y1="100" x2="620" y2="100" stroke="#E2E8F0"/>

      <text x="30" y="32" font-weight="bold" fill="#0B1F3A" font-size="14">Principal Business Activity:</text>
      <text x="240" y="32" font-size="14">General Civil Construction &amp; Infrastructure Development</text>

      <text x="30" y="82" font-weight="bold" fill="#0B1F3A" font-size="14">Registered Office Address:</text>
      <text x="240" y="82" font-size="14">Shahrah-e-Faisal, PECHS Block 6, Karachi, Pakistan</text>

      <text x="30" y="132" font-weight="bold" fill="#0B1F3A" font-size="14">Date of Incorporation:</text>
      <text x="240" y="132" font-size="14">12th October 2011</text>
    </g>

    <!-- Given Under Hand -->
    <text x="80" y="850">
      <tspan x="80" dy="0">Given under my hand and official seal at Karachi this 12th day of October, 2011.</tspan>
    </text>
  </g>

  <!-- Official Gold Seal -->
  <g transform="translate(180, 950)">
    <circle cx="0" cy="0" r="55" fill="url(#goldGrad)" stroke="#9A7B1C" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="0" y="-20" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#0B1F3A">SECP OFFICIAL SEAL</text>
    <text x="0" y="5" text-anchor="middle" font-family="'Times New Roman', serif" font-size="13" font-weight="bold" fill="#0B1F3A">VERIFIED</text>
    <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0B1F3A">REGISTRAR OF COMPANIES</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(540, 940)" text-anchor="middle" font-family="Arial, sans-serif">
    <!-- Signature Graphic -->
    <path d="M-60,0 Q-30,-25 0,-5 T40,-20 T70,-5" fill="none" stroke="#0B1F3A" stroke-width="2"/>
    <line x1="-80" y1="15" x2="80" y2="15" stroke="#333333" stroke-width="1"/>
    <text x="0" y="32" font-size="12" font-weight="bold" fill="#0B1F3A">Registrar of Companies</text>
    <text x="0" y="48" font-size="10" fill="#666666">Securities &amp; Exchange Commission of Pakistan</text>
  </g>

  <!-- Security Barcode and Footer -->
  <g transform="translate(80, 1055)" font-family="monospace" font-size="10" fill="#777777">
    <rect x="0" y="0" width="3" height="20" fill="#333"/>
    <rect x="5" y="0" width="1" height="20" fill="#333"/>
    <rect x="8" y="0" width="4" height="20" fill="#333"/>
    <rect x="15" y="0" width="2" height="20" fill="#333"/>
    <rect x="20" y="0" width="1" height="20" fill="#333"/>
    <rect x="24" y="0" width="3" height="20" fill="#333"/>
    <rect x="30" y="0" width="2" height="20" fill="#333"/>
    <rect x="35" y="0" width="4" height="20" fill="#333"/>
    <rect x="42" y="0" width="1" height="20" fill="#333"/>
    <rect x="45" y="0" width="3" height="20" fill="#333"/>
    <rect x="52" y="0" width="2" height="20" fill="#333"/>
    <rect x="57" y="0" width="3" height="20" fill="#333"/>
    <rect x="63" y="0" width="1" height="20" fill="#333"/>
    <rect x="68" y="0" width="4" height="20" fill="#333"/>
    <rect x="75" y="0" width="2" height="20" fill="#333"/>
    <text x="85" y="14" font-size="10">SECP-VERIF-DOC-CUIN-0192847-AUTHENTIC</text>
  </g>
</svg>

