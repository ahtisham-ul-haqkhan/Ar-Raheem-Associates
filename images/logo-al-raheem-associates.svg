<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 85" width="100%" height="100%">
  <!-- House & Key Emblem -->
  <g transform="translate(10, 10)">
    <!-- Key Head Ring -->
    <circle cx="32" cy="32" r="28" fill="none" stroke="#C9A227" stroke-width="4.5"/>
    <circle cx="32" cy="32" r="24" fill="#0B1F3A"/>
    <!-- House Roof -->
    <path d="M 21 34 L 32 22 L 43 34 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- House Body -->
    <rect x="24" y="34" width="16" height="11" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Arched Doorway -->
    <path d="M 29 45 L 29 38 A 3 3 0 0 1 35 38 L 35 45 Z" fill="#C9A227"/>
    <!-- Key Shaft -->
    <path d="M 60 32 L 105 32 L 114 26 L 118 32 L 114 38 L 105 32" fill="#C9A227" stroke="#C9A227" stroke-width="2" stroke-linejoin="round"/>
    <!-- Key Teeth -->
    <rect x="82" y="32" width="6" height="9" rx="1" fill="#C9A227"/>
    <rect x="94" y="32" width="6" height="12" rx="1" fill="#C9A227"/>
  </g>

  <!-- Brand Typography: AL-RAHEEM ASSOCIATES -->
  <g transform="translate(135, 12)">
    <text x="0" y="32" font-family="'Poppins', 'Arial Black', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="3.5">AL-RAHEEM</text>
    <text x="2" y="58" font-family="'Poppins', 'Arial Black', sans-serif" font-size="18" font-weight="900" fill="#C9A227" letter-spacing="4">ASSOCIATES</text>
  </g>
</svg>