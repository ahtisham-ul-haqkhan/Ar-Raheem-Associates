<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1130" width="100%" height="100%">
  <defs>
    <linearGradient id="ntnGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F5132"/>
      <stop offset="50%" stop-color="#198754"/>
      <stop offset="100%" stop-color="#0A3622"/>
    </linearGradient>
    <linearGradient id="goldSeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="50%" stop-color="#F3DC82"/>
      <stop offset="100%" stop-color="#8E6F14"/>
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect width="800" height="1130" fill="#FFFFFF"/>
  
  <!-- Border -->
  <rect x="25" y="25" width="750" height="1080" fill="none" stroke="#0F5132" stroke-width="4"/>
  <rect x="35" y="35" width="730" height="1060" fill="none" stroke="#C9A227" stroke-width="1.5"/>

  <!-- Official Header -->
  <g text-anchor="middle" font-family="'Times New Roman', serif">
    <!-- Star and Crescent Pakistani Emblem -->
    <circle cx="400" cy="100" r="35" fill="#0F5132"/>
    <path d="M410 82 A 18 18 0 1 0 410 118 A 15 15 0 1 1 410 82 Z" fill="#FFFFFF"/>
    <polygon points="418,92 422,96 427,95 424,99 426,104 421,102 418,106 418,100 413,98 418,97" fill="#FFFFFF"/>

    <text x="400" y="165" font-size="20" font-weight="bold" fill="#0F5132" letter-spacing="2">FEDERAL BOARD OF REVENUE</text>
    <text x="400" y="185" font-size="13" fill="#444444" letter-spacing="1">REVENUE DIVISION - GOVERNMENT OF PAKISTAN</text>
    <text x="400" y="205" font-size="12" fill="#555555">ONLINE TAXPAYER VERIFICATION SYSTEM &#8226; RTO-I KARACHI</text>

    <line x1="160" y1="220" x2="640" y2="220" stroke="#0F5132" stroke-width="2"/>

    <text x="400" y="265" font-size="24" font-weight="bold" fill="#0B1F3A" letter-spacing="1">TAXPAYER REGISTRATION CERTIFICATE</text>
    <text x="400" y="290" font-size="13" font-style="italic" fill="#555555">[Under Section 181 of the Income Tax Ordinance, 2001]</text>
  </g>

  <!-- Highlight Box with NTN -->
  <g font-family="Arial, sans-serif" transform="translate(80, 315)">
    <rect width="640" height="75" fill="#F0FDF4" stroke="#86EFAC" rx="8"/>
    <text x="30" y="32" font-size="14" font-weight="bold" fill="#0F5132">NATIONAL TAX NUMBER (NTN / REFERENCE NO):</text>
    <text x="30" y="62" font-size="26" font-weight="bold" fill="#0B1F3A" letter-spacing="3">5357401-7</text>
    <rect x="460" y="18" width="150" height="38" fill="#15803D" rx="6"/>
    <text x="535" y="42" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ACTIVE (ATL)</text>
  </g>

  <!-- Detailed Taxpayer Record -->
  <g font-family="Arial, sans-serif" transform="translate(80, 415)">
    <rect width="640" height="420" fill="#FFFFFF" stroke="#CBD5E1" rx="6"/>
    
    <!-- Table Rows -->
    <g font-size="13.5">
      <rect x="0" y="0" width="640" height="42" fill="#F8FAFC" rx="6 6 0 0"/>
      <text x="25" y="26" font-weight="bold" fill="#0B1F3A">Taxpayer Legal Name:</text>
      <text x="240" y="26" font-weight="bold" fill="#1F2937">ZOHAIB KHAN</text>

      <line x1="0" y1="42" x2="640" y2="42" stroke="#E2E8F0"/>
      <text x="25" y="68" font-weight="bold" fill="#0B1F3A">Registration / CNIC No:</text>
      <text x="240" y="68" font-weight="bold" fill="#1F2937">42401-8997962-9</text>

      <line x1="0" y1="84" x2="640" y2="84" stroke="#E2E8F0"/>
      <text x="25" y="110" font-weight="bold" fill="#0B1F3A">Business / Operating Names:</text>
      <text x="240" y="110" font-weight="bold" fill="#0F5132">AL-RAHEEM ASSOCIATES</text>

      <line x1="0" y1="126" x2="640" y2="126" stroke="#E2E8F0"/>
      <text x="25" y="152" font-weight="bold" fill="#0B1F3A">Category / Constitution:</text>
      <text x="240" y="152" fill="#1F2937">Pakistani Male / Individual Commercial Proprietor</text>

      <line x1="0" y1="168" x2="640" y2="168" stroke="#E2E8F0"/>
      <text x="25" y="194" font-weight="bold" fill="#0B1F3A">Principal Activity:</text>
      <text x="240" y="194" fill="#1F2937">681000 - Real Estate &amp; Civil Development Activities</text>

      <line x1="0" y1="210" x2="640" y2="210" stroke="#E2E8F0"/>
      <text x="25" y="236" font-weight="bold" fill="#0B1F3A">Registration Status:</text>
      <text x="240" y="236" font-weight="bold" fill="#15803D">Income Tax: ACTIVE (Active Taxpayers List - ATL)</text>

      <line x1="0" y1="252" x2="640" y2="252" stroke="#E2E8F0"/>
      <text x="25" y="278" font-weight="bold" fill="#0B1F3A">Business Address:</text>
      <text x="240" y="278" fill="#1F2937">Shop No. 4, Plot 128 (Azan Centre), Near NBP Bank, Keamari, Karachi</text>

      <line x1="0" y1="294" x2="640" y2="294" stroke="#E2E8F0"/>
      <text x="25" y="320" font-weight="bold" fill="#0B1F3A">Tax Jurisdiction:</text>
      <text x="240" y="320" fill="#1F2937">Regional Tax Office - I (RTO-I), Karachi</text>

      <line x1="0" y1="336" x2="640" y2="336" stroke="#E2E8F0"/>
      <text x="25" y="362" font-weight="bold" fill="#0B1F3A">Registration Date:</text>
      <text x="240" y="362" fill="#1F2937">05-APR-2019 (Verified Active)</text>

      <line x1="0" y1="378" x2="640" y2="378" stroke="#E2E8F0"/>
      <text x="25" y="402" font-weight="bold" fill="#0B1F3A">Official Verification:</text>
      <text x="240" y="402" fill="#15803D">FBR IRIS Portal Verified Document</text>
    </g>
  </g>

  <!-- Verification Stamp -->
  <g transform="translate(190, 930)">
    <circle cx="0" cy="0" r="48" fill="url(#goldSeal)" stroke="#8E6F14" stroke-width="2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="3,2"/>
    <text x="0" y="-14" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#0B1F3A">FBR IRIS VERIFIED</text>
    <text x="0" y="6" text-anchor="middle" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" fill="#0B1F3A">ACTIVE ATL</text>
    <text x="0" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#0B1F3A">OFFICIAL RECORD</text>
  </g>

  <!-- Commissioner Sign -->
  <g transform="translate(550, 930)" text-anchor="middle" font-family="Arial, sans-serif">
    <path d="M-50,-10 Q-20,-30 10,-10 T60,-15" fill="none" stroke="#0F5132" stroke-width="2"/>
    <line x1="-80" y1="10" x2="80" y2="10" stroke="#333333" stroke-width="1"/>
    <text x="0" y="28" font-size="12" font-weight="bold" fill="#0B1F3A">Chief Commissioner Inland Revenue</text>
    <text x="0" y="44" font-size="10" fill="#666666">Regional Tax Office - I (RTO-I), Karachi</text>
    <text x="0" y="58" font-size="9" fill="#999999">Government of Pakistan</text>
  </g>

  <!-- Barcode / Reference -->
  <g transform="translate(80, 1030)">
    <rect x="0" y="0" width="640" height="25" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="10" y="16" font-family="monospace" font-size="11" fill="#64748B">TRACKING ID: FBR-IRIS-5357401-7-ATL-4240189979629 | SECURE VERIFIED RECORD</text>
  </g>
</svg>
